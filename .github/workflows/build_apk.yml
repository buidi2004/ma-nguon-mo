name: Build & Release OpenFlix APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release cùng với APK đính kèm'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test test/screens_test.dart test/backend_integration_test.dart test/ux_ui_audit_test.dart test/glass_bar_test.dart test/glass_buttons_test.dart

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OpenFlix-v3.0.0-release.apk
          ls -lh dist/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlix-Android-APK
          path: dist/OpenFlix-v3.0.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenFlix Release APK {0}', github.ref_name) || 'OpenFlix Release APK v3.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### 🎬 OpenFlix Android Release APK v3.0.0
            
            - **Phiên bản:** v3.0.0
            - **Cấu hình:** Android Release (Signed với debug key tương thích sẵn cho cài đặt trực tiếp)
            - **Hệ thống Nút Bấm Kính Mờ Quang Học (Glass Button Components):** Tích hợp đầy đủ Giai đoạn 1–4 chuẩn điện ảnh Netflix (Touch target $\ge 44\times 44$px, Haptic Feedback, Micro-spring 150–220ms, Snell 1.25–1.48, Blur 8.0–20.0).
            - **Trình Phát Video (S20):** Bổ sung nút tròn phát phim quang học `GlassPlayerPlayButton` với vòng hào quang Pulse Glow Ring và thanh công cụ điều khiển phương tiện `GlassMediaToolbar` (Tua ±10s, Khung hình 16:9/Tràn viền/Kéo giãn, Tốc độ 1.0x–2.0x, Tắt tiếng, Toàn màn hình).
            - **Thanh Điều Hướng Kính Mờ:** Floating Glass Bottom Bar siêu trong suốt với viên thuốc chỉ báo màu đỏ Netflix rực rỡ.
            - **Backend:** PocketBase Linux VPS `180.93.120.246:8090` (40 phim FOSS chuẩn điện ảnh với MP4 FastStart).
            - **Kiểm thử chất lượng:** 177/177 bài test tự động đạt 100% PASS, 0 lỗi phân tích cú pháp tĩnh (`flutter analyze`).
            - **Tương thích:** Android 5.0 (API 21) trở lên (arm64-v8a, armeabi-v7a, x86_64).
            
            #### 📥 Tải xuống cài đặt:
            Tải file **OpenFlix-v3.0.0-release.apk** bên dưới và cài đặt trực tiếp trên thiết bị Android của bạn.
          files: |
            dist/OpenFlix-v3.0.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
