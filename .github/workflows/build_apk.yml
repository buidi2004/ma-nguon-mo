name: Build & Release OpenFlix APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release cùng với APK đính kèm'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test test/screens_test.dart test/backend_integration_test.dart test/ux_ui_audit_test.dart test/glass_bar_test.dart test/glass_buttons_test.dart

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OpenFlix-v4.0.0-release.apk
          ls -lh dist/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlix-Android-APK
          path: dist/OpenFlix-v4.0.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenFlix Release APK {0}', github.ref_name) || 'OpenFlix Release APK v4.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### 🎬 OpenFlix Android Release APK v4.0.0
            
            - **Phiên bản:** v4.0.0
            - **Cấu hình:** Android Release (Signed với debug key tương thích sẵn cho cài đặt trực tiếp)
            - **Biểu tượng ứng dụng điện ảnh 3D:** Bộ icon 3D cao cấp đỏ đen trên toàn bộ nền tảng (Adaptive Android, iOS, Web, Windows .ico, Linux, macOS) và Splash screen đồng bộ.
            - **Tối ưu hóa khởi động & Triệt tiêu giật lag:** Khử trùng lặp request PocketBase (`_inFlightMoviesRequest`), timeout 3.5s với cơ chế failover tức thì sang Offline Mock Data, RAM caching loại bỏ triệt để hiện tượng spinner kép, Skeleton shimmer mượt mà.
            - **Căn chỉnh quang học hoàn hảo (Optical Alignment):** Sửa toàn diện các lỗi lệch trục ngang giữa Icon và Chữ trên 44 màn hình (Auth Banners, Help Center, About Screen, Membership Plans, Glass Radio Tiles, Glass Menu, Notifications).
            - **Tích hợp bộ công cụ Kiến trúc Archify:** Sơ đồ kiến trúc tương tác đa tầng trực quan với Live Motion và Dark/Light mode.
            - **Kiểm thử chất lượng:** 112/112 bài test tự động đạt 100% PASS, 0 lỗi phân tích cú pháp tĩnh (`flutter analyze`).
            - **Tương thích:** Android 5.0 (API 21) trở lên (arm64-v8a, armeabi-v7a, x86_64).
            
            #### 📥 Tải xuống cài đặt:
            Tải file **OpenFlix-v4.0.0-release.apk** bên dưới và cài đặt trực tiếp trên thiết bị Android của bạn.
          files: |
            dist/OpenFlix-v4.0.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
