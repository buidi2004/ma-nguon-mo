name: Build & Release OpenFlix APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release cùng với APK đính kèm'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test test/screens_test.dart test/backend_integration_test.dart test/ux_ui_audit_test.dart test/glass_bar_test.dart test/glass_buttons_test.dart test/fullscreen_player_gesture_test.dart test/performance_benchmark_test.dart test/feedback_screen_test.dart

      - name: Configure Keystore (If GitHub Secret Provided)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Decoding production keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD || '246824' }}
          keyPassword=${{ secrets.KEY_PASSWORD || '246824' }}
          keyAlias=${{ secrets.KEY_ALIAS || 'upload' }}
          storeFile=upload-keystore.jks
          EOF
            echo "✅ Keystore configured successfully for release signing."
          else
            echo "ℹ️ No KEYSTORE_BASE64 secret found. Falling back to debug signature for testing."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OpenFlix-v6.0.0-release.apk
          ls -lh dist/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlix-Android-APK
          path: dist/OpenFlix-v6.0.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v6.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenFlix Release APK {0}', github.ref_name) || 'OpenFlix Release APK v6.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### 🎬 OpenFlix Android Release APK v6.0.0
            
            - **Phiên bản:** v6.0.0 (Build 6)
            - **Cấu hình:** Android Release Production Signed (`upload-keystore.jks` / Google Play Ready)
            - **Điểm nổi bật trên Phiên bản V6:**
              - **Biểu tượng khởi động 3D Điện ảnh mới:** Thay thế toàn diện logo cũ bằng biểu tượng V điện ảnh 3D nổi bật, tích hợp Smart Splash Kit chuẩn Dark Cinema.
              - **Google OAuth 2.0 Web Client:** Tích hợp chuẩn xác Client ID cho xác thực một chạm Android Credential Manager & xác minh ID Token trên PocketBase.
              - **Cụm rạp Sen Phim & Đặt vé xem phim chiếu rạp:** Mock module rạp chiếu phim Việt Nam & Thái Lan, sơ đồ chọn ghế trực quan và thanh toán vé.
              - **Tối ưu hóa UI/UX Toàn diện:** 100% các màn hình chuẩn hóa responsive, triệt tiêu hoàn toàn lỗi tràn layout trên mọi kích thước màn hình từ 320px đến Tablet 1200px.
              - **Tối ưu Trình phát Video:** Hỗ trợ điều khiển cử chỉ YouTube Hybrid (chạm đúp tua ±10s, HUD mờ quang học, zoom & fit mode).
            - **Độ tin cậy & Kiểm thử:**
              - 100% bài kiểm tra tự động đạt chuẩn (PASS).
              - 0 lỗi phân tích tĩnh (`flutter analyze`).
              - Đạt chuẩn UX/UI Netflix-inspired theo `AGENTS.md`.
            - **Tương thích thiết bị:** Android 5.0 (API 21) trở lên (arm64-v8a, armeabi-v7a, x86_64).
            
            #### 📥 Tải xuống cài đặt:
            Tải file **OpenFlix-v6.0.0-release.apk** bên dưới và cài đặt trực tiếp trên thiết bị Android của bạn.
          files: |
            dist/OpenFlix-v6.0.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
