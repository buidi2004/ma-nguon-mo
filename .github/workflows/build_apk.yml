name: Build & Release OpenFlix APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release cùng với APK đính kèm'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test test/screens_test.dart test/backend_integration_test.dart test/ux_ui_audit_test.dart

      - name: Build Release APK
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OpenFlix-v1.0.0-release.apk
          ls -lh dist/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlix-Android-APK
          path: dist/OpenFlix-v1.0.0-release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-release' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenFlix Release APK {0}', github.ref_name) || 'OpenFlix Release APK v1.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### 🎬 OpenFlix Android Release APK
            
            - **Phiên bản:** v1.0.0
            - **Cấu hình:** Android Release (Signed với debug key tương thích sẵn cho cài đặt trực tiếp)
            - **Backend:** PocketBase Linux VPS `180.93.120.246:8090` (40 phim FOSS chuẩn điện ảnh)
            - **Giao diện:** 42 màn hình chuẩn Netflix-inspired Dark Theme
            - **Tương thích:** Android 5.0 (API 21) trở lên (arm64-v8a, armeabi-v7a, x86_64)
            
            #### 📥 Tải xuống cài đặt:
            Tải file **OpenFlix-v1.0.0-release.apk** bên dưới và cài đặt trực tiếp trên thiết bị Android của bạn.
          files: |
            dist/OpenFlix-v1.0.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
