# =============================================================================
# OpenFlix — Cấu hình nginx phục vụ endpoint /metrics
# -----------------------------------------------------------------------------
# Dán khối `location = /metrics { ... }` vào **trước** `location /` của server
# block đang chạy trên cổng 80 (cùng server block phục vụ /posters).
#
# Bảo mật: endpoint này lộ %CPU, RAM, dung lượng ổ cứng của VPS. Chọn 1 trong 2
# cách (hoặc cả hai):
#   1) Token bí mật qua header `X-Metrics-Token`  (khuyến nghị cho app di động)
#   2) Allowlist IP quản trị
# =============================================================================

# --- Cách 1: Token bí mật -----------------------------------------------------
# Đổi giá trị dưới đây thành token ngẫu nhiên của bạn, ví dụ tạo bằng:
#   openssl rand -hex 32
# Sau đó nạp đúng token đó vào app (xem docs/DEPLOY_METRICS_ENDPOINT.md).
location = /metrics {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;

    if ($http_x_metrics_token != "THAY_BANG_TOKEN_NGAU_NHIEN_CUA_BAN") {
        return 403;
    }

    alias /var/www/openflix-metrics/metrics.json;
}

# --- Cách 2: Allowlist IP (dùng khi app luôn chạy từ mạng cố định) ------------
# location = /metrics {
#     default_type application/json;
#     add_header Cache-Control "no-store" always;
#     access_log off;
#     allow 1.2.3.4;        # IP admin
#     deny all;
#     alias /var/www/openflix-metrics/metrics.json;
# }
